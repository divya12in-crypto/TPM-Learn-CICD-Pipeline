
name: My First CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration file
        run: |
          echo "Starting automated validation..."
          test -f REQUIRED_CONFIG.txt
          echo "SUCCESS: Required configuration file exists!"
